video:
  display_width: 960      # long side of the frame sent to the browser
  # Detection size drives how many people are found, and costs CPU:
  #   640  -> ~15 people on the demo clip, ~11 fps   (fast)
  #   960  -> ~20 people,  ~6 fps                    (default, balanced)
  #  1280  -> ~27 people,  ~4 fps                    (crowd mode, used for the README stills)
  det_imgsz: 960
  det_conf: 0.3
  flow_width: 384         # reduced long side for optical flow
  jpeg_quality: 70
  send_fps: 18            # frames/s del video en el dashboard (display desacoplado)
  webcam_index: 0         # indice de la camara para el modo directo

metrics:
  rate_hz: 2
  ema_alpha: 0.35
  peak_z: 2.2
  peak_min_gap_s: 10

server:
  host: 127.0.0.1
  port: 8765

model:
  weights: models/yolov8n-pose.pt   # deteccion + esqueleto 17 puntos en una sola red

dj:
  simulate: true        # simulated DJ set (no licensed catalogue) -- see engine/dj.py
  track_seconds: 14     # how long each simulated track plays before the next pick

audio:
  spl_offset: 108       # dBFS -> dB SPL estimate (a laptop mic is not calibrated)
